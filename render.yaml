# Render blueprint for the backend (API, Claude agent, Excel builder).
# The web pages are served by Netlify, which forwards /api/* here (see netlify.toml).
services:
  - type: web
    name: model-starter-api
    runtime: docker
    plan: free               # the free disk is wiped when the server sleeps; data is kept in a private GitHub repo instead (app/persist.py)
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # paste it in the Render dashboard, never in the repo
      - key: TEAM_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SEC_USER_AGENT
        sync: false          # e.g. "Your Firm research@yourfirm.com" (SEC requires a contact)
      - key: GITHUB_REPO
        value: PGiam/Model-Starter
      - key: DATA_REPO
        sync: false          # a PRIVATE repo for saved chats, models and the playbook, e.g. PGiam/model-starter-data
      - key: GITHUB_TOKEN
        sync: false          # fine-grained token: Contents read/write on DATA_REPO, Issues read/write on GITHUB_REPO
