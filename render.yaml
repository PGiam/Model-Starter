# Render blueprint for the backend (API, Claude agent, Excel builder).
# The web pages are served by Netlify, which forwards /api/* here (see netlify.toml).
services:
  - type: web
    name: model-starter-api
    runtime: docker
    plan: free                # no persistent disk on the free plan: sessions/models/filings are lost on every restart or redeploy, and the instance sleeps after ~15 min idle
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # paste it in the Render dashboard, never in the repo
      - key: TEAM_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SEC_USER_AGENT
        sync: false          # e.g. "Your Firm research@yourfirm.com" (SEC requires a contact)
      - key: GITHUB_REPO
        value: PGiam/Model-Starter
      - key: GITHUB_TOKEN
        sync: false          # fine-grained token with Issues: read/write on this repo only
